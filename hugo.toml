baseURL = 'https://warden2018.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = "zh"
title = "Yang's Blog"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = true
  UseHugoToc = true
  mainSections = ["posts"]

  # 评论系统配置
  [params.comments]
    enable = true

    # Utterances 配置（推荐）
    [params.comments.utterances]
      enable = true
      repo = "warden2018/warden2018.github.io"  # 替换为你的 GitHub 仓库
      issueTerm = "pathname"  # 使用页面路径作为 issue 标题
      theme = "github-light"  # 主题：github-light, github-dark, preferred-color-scheme

    # Giscus 配置（可选）
    [params.comments.giscus]
      enable = false  # 如果要使用 Giscus，设为 true
      repo = "warden2018/warden2018.github.io"
      repoId = "R_kgDOGHGQow"  # 从 Giscus 获取
      category = "Announcements"
      categoryId = "DIC_kwDOGHGQo84CPZde"  # 从 Giscus 获取
      mapping = "pathname"
      strict = "0"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      lang = "zh-CN"

  [params.homeInfoParams]
    Title = "Yang's Blog"
    Content = "你好，欢迎来到我的博客。这里记录我的学习与生活。"

  [params.assets]
    favicon = "favicon-32x32.png"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/warden2018"


[menu]
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"

[services]
  [services.rss]
    limit = 42
